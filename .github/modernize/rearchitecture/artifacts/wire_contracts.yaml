contracts:
  - name: Account signup
    unit: auth-signup-api
    type: rest
    stability: must_preserve
    source_loc: 'backend\routes\authRouter.js:9'
    contract:
      method: POST
      path: /api/auth/signup
      request: "{name, email, password}"
      response: "200 JSON {message, user}; sets express-session userId"
      error: "400 {message: 'user already exists'}; 500 {message: err.message}"
      auth: "No prior authenticated session required by route."
    target_contract:
      method: "POST /api/auth/signup"
      notes: "Preserve request fields, success user payload, session assignment, and status/error outcomes."
    semantic_divergence: []


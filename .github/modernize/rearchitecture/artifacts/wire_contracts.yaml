      method: POST
      path: /api/auth/login
      request: "{email, password}"
      response: "200 JSON {message, user}; sets express-session userId"
      error: "404 {message: 'user not found'}; 400 {message: 'incorrect credentials'}; 500 {message: err.message}"
      auth: "No prior authenticated session required by route."
    target_contract:
      method: "POST /api/auth/login"
      notes: "Preserve bcrypt comparison, session assignment, response fields, and status/error outcomes."
    semantic_divergence: []

  - name: Account logout
    unit: auth-logout-api
    type: rest
    stability: must_preserve
    source_loc: 'backend\routes\authRouter.js:15'
    contract:
      method: POST
      path: /api/auth/logout
      request: "No body read by handler"
      response: "200 JSON {message: 'logged out'} after session destroy request"
      error: "No explicit handler for session-destroy errors."
      auth: "No prior authenticated session required by route."
    target_contract:
      method: "POST /api/auth/logout"
      notes: "Preserve session destruction and JSON response."
    semantic_divergence: []

  - name: Create chat
    unit: chat-create-api
    type: rest
    stability: must_preserve
    source_loc: 'backend\routes\chatRouter.js:10'
    contract:
      method: POST
      path: /api/new-chat/:userId
      request: "No body read by handler; userId is a path parameter"
      response: "200 JSON newly created Chat document with title 'new chat' and messages []"
      error: "500 {message: err.message}"
      auth: "No auth middleware is applied to this route."
    target_contract:
      method: "POST /api/new-chat/{userId}"
      notes: "Return the created chat document and preserve initial title/messages."
    semantic_divergence: []

  - name: List chats
    unit: chat-list-api
    type: rest
    stability: must_preserve
    source_loc: 'backend\routes\chatRouter.js:11'
    contract:
      method: GET
      path: /api/chats/:userId
      request: "userId path parameter"
      response: "200 JSON array of chats for userId, with messages projected out"
      error: "500 {message: err.message}"
      auth: "No auth middleware is applied to this route."
    target_contract:
      method: "GET /api/chats/{userId}"
      notes: "Preserve user filter and omission of messages in each list item."
    semantic_divergence: []

  - name: Read chat
    unit: chat-read-api
    type: rest
    stability: must_preserve
    source_loc: 'backend\routes\chatRouter.js:12'
    contract:
      method: GET
      path: /api/chat/:userId/:chatId
      request: "userId and chatId path parameters"
      response: "200 JSON matching Chat document, or null when no matching document exists"
      error: "500 {message: err.message}"
      auth: "No auth middleware is applied to this route."
    target_contract:
      method: "GET /api/chat/{userId}/{chatId}"
      notes: "Preserve matching by both userId and chatId and the current null result behavior."
    semantic_divergence: []

  - name: Send chat message
    unit: chat-send-api
    type: rest
    stability: must_preserve
    source_loc: 'backend\routes\chatRouter.js:13'
    contract:
      method: POST
      path: /api/chat/:userId/:chatId
      request: "{message}"
      response: "200 JSON {reply}; on missing chat, 404 {message: 'chat not found'}"
      error: "500 {message: err.message, details: err.response?.data} for caught failures"
      auth: "No auth middleware is applied to this route."
    target_contract:
      method: "POST /api/chat/{userId}/{chatId} -> {reply}"
      notes: "Preserve first-message title truncation, chatbot request/response mapping, and message persistence after successful reply."
    semantic_divergence: []

  - name: Chatbot health response
    unit: chatbot-health-api
    type: rest
    stability: must_preserve
    source_loc: 'chatbot\app.py:68'
    contract:
      method: GET
      path: /
      request: "No request body"
      response: "200 text: Medical Chatbot API is running 🚀"
      error: "No explicit error response."
      auth: "None"
    target_contract:
      method: "GET / -> plain text health response"
      notes: "Keep the root route's plain-text body."
    semantic_divergence: []

  - name: Retrieval chatbot response
    unit: chatbot-chat-api
    type: rest
    stability: must_preserve
    source_loc: 'chatbot\app.py:72'
    contract:
      method: POST

unit: login-page
side_effects:
  - source_loc: 'medical-chatbot-react-version\src\pages\Login.jsx:68'
    effect: "Stores the returned user JSON in localStorage under user."
    must_preserve: true
branches:
  - source_loc: 'medical-chatbot-react-version\src\pages\Login.jsx:72'
    condition: "Login request succeeds."
    behavior: "Redirects to /App/dashboard."
    must_preserve: true
  - source_loc: 'medical-chatbot-react-version\src\pages\Login.jsx:77'
    condition: "API responds 404 (user not found)."
    behavior: "Redirects to /signup."
    must_preserve: true
  - source_loc: 'medical-chatbot-react-version\src\pages\Login.jsx:81'
    condition: "API responds 400."
    behavior: "Returns action data with error 'Incorrect credentials'."
    must_preserve: true
  - source_loc: 'medical-chatbot-react-version\src\pages\Login.jsx:85'
    condition: "Any other login error."
    behavior: "Returns action data with error 'Server error'."
    must_preserve: true
error_paths:
  - source_loc: 'medical-chatbot-react-version\src\pages\Login.jsx:74'
    trigger: "Axios login request rejects."
    outcome: "Maps 404 and 400 to separate UI action outcomes; maps other failures to Server error."
    contract: "404 redirects to signup; 400 returns Incorrect credentials; otherwise returns Server error."
    must_preserve: true
concurrency:
  model: event-loop

services:
  - type: pserv
    name: medical-chatbot-rag
    runtime: python
    region: oregon
    plan: "1c-2g"
    rootDir: chatbot
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.4"
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b

  - type: web
    name: medical-chatbot-backend
    runtime: node
    region: oregon
    plan: "0.5c-512mb"
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: MONGO_URL
        sync: false
      - key: SESSION_KEY
        generateValue: true
      - key: CHATBOT_API_URL
        fromService:
          type: pserv
          name: medical-chatbot-rag
          property: hostport
      - key: BACKEND_PUBLIC_URL
        fromService:
          type: web
          name: medical-chatbot-backend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: medical-chatbot-frontend
    runtime: static
    rootDir: medical-chatbot-react-version
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: medical-chatbot-backend
          envVarKey: BACKEND_PUBLIC_URL
